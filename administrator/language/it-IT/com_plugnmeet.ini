COM_PLUGNMEET_ROOM_TAB_INSIGHTS_AI_FEATURES="Insight AI"
COM_PLUGNMEET_INSIGHTS_IS_ALLOW="Abilita le funzionalità di insight"
COM_PLUGNMEET_INSIGHTS_IS_ALLOW_DES="Abilita strumenti avanzati di analisi e basati sull'IA per questa stanza, come la trascrizione e la traduzione in tempo reale. Disattivando questo interruttore master tutte le funzionalità correlate qui sotto. <br><b>Avviso sulla privacy:</b> L'attivazione di queste informazioni può condividere i dati delle riunioni (come messaggi audio e chat) con fornitori di servizi esterni per l'elaborazione. Assicurati che questo sia conforme alla tua informativa sulla privacy."
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW="Abilita la trascrizione in tempo reale"
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW_DES="Fornire la trascrizione in tempo reale dell'audio della riunione, permettendo ai partecipanti di leggere la conversazione mentre si svolge."
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW_TRANSLATION="Abilita la traduzione live per la trascrizione"
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW_TRANSLATION_DES="Permette ai partecipanti di tradurre la trascrizione dal vivo nella loro lingua preferita."
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW_SPEECH_SYNTHESIS="Abilita i sottotitoli parlati"
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW_SPEECH_SYNTHESIS_DES="Permette ai partecipanti di ascoltare i sottotitoli tradotti pronunciati ad alta voce nella loro lingua scelta."
COM_PLUGNMEET_INSIGHTS_CHAT_TRANSLATION_IS_ALLOW="Abilita la traduzione dei messaggi della chat"
COM_PLUGNMEET_INSIGHTS_CHAT_TRANSLATION_IS_ALLOW_DES="Consentire ai partecipanti di tradurre i messaggi della chat nella loro lingua preferita."
COM_PLUGNMEET_INSIGHTS_AI_FEATURES_IS_ALLOW="Abilita le funzionalità dell'IA"
COM_PLUGNMEET_INSIGHTS_AI_FEATURES_IS_ALLOW_DES="Abilita strumenti utili basati su IA per questa stanza, come riassunti automatici delle riunioni e un assistente chat AI per la conversazione. Disattivando questo sistema si disattiveranno tutte le specifiche funzionalità dell'IA qui sotto. <br><b>Avviso sulla privacy:</b> Questi strumenti elaborano i contenuti delle riunioni tramite fornitori di IA esterni. Si prega di utilizzarli in conformità con le linee guida sulla privacy della vostra organizzazione."
COM_PLUGNMEET_INSIGHTS_AI_TEXT_CHAT_IS_ALLOW="Abilita l'Assistente Chat AI"
COM_PLUGNMEET_INSIGHTS_AI_TEXT_CHAT_IS_ALLOW_DES="Fornire ai partecipanti un assistente chat alimentato dall'IA per rispondere alle domande e fornire informazioni durante la riunione."
COM_PLUGNMEET_INSIGHTS_MEETING_SUMMARIZATION_IS_ALLOW="Abilita i Riepiloghi Automatici delle Riunioni"
COM_PLUGNMEET_INSIGHTS_MEETING_SUMMARIZATION_IS_ALLOW_DES="Genera automaticamente un riassunto della riunione, inclusi argomenti chiave e azioni principali, disponibile dopo la fine della sessione."

COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_IS_ALLOW="Abilita il SIP Dial-In"
COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_IS_ALLOW_DES="Consentire ai partecipanti di partecipare all'audio della riunione tramite una telefonata regolare."
COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_ENABLE_ON_CREATE="Abilita Dial-In su Creazione"
COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_ENABLE_ON_CREATE_DES="Se attivato, il servizio SIP dial-in si avvierà automaticamente quando la stanza viene creata."
COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_HIDE_PHONE="Numeri di telefono dei partecipanti con mascherina"
COM_PLUGNMEET_EXTERNAL_BROADCASTING_IS_ALLOW="Abilitazione della trasmissione esterna"
COM_PLUGNMEET_EXTERNAL_BROADCASTING_IS_ALLOW_DES="Abilita funzionalità relative alla trasmissione esterna, come lo streaming RTMP."
COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_HIDE_PHONE_DES="Se abilitato, il numero di telefono completo dei partecipanti al dial-in sarà mascherato e solo le ultime 4 cifre saranno mostrate come loro nome."

