COM_PLUGNMEET_LOCK_CHAT_SEND_FILE="Blocca chat invia file"
COM_PLUGNMEET_LOCK_CHAT_SEND_FILE_DES="Lock file sharing in chat for participants. They cannot share files in the chat until a moderator unlocks it."
COM_PLUGNMEET_LOCK_CHAT_SEND_MESSAGE="Blocca chat invia messaggio"
