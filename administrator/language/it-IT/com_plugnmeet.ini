COM_PLUGNMEET_LOCK_MICROPHONE="Lock microphone"
COM_PLUGNMEET_LOCK_MICROPHONE_DES="Lock the microphone for participants. They cannot turn on or use their microphone until a moderator unlocks it."
COM_PLUGNMEET_LOCK_PRIVATE_CHAT="Blocca chat privata"
COM_PLUGNMEET_LOCK_PRIVATE_CHAT_DES="Lock private chat for participants. They cannot send private messages to other participants until a moderator unlocks it. They can still send private messages to moderators."
COM_PLUGNMEET_LOCK_SCREEN_SHARING="Condivisione della schermata di blocco"
COM_PLUGNMEET_LOCK_SCREEN_SHARING_DES="Lock screen sharing for participants. They cannot share their screen until a moderator unlocks it."
COM_PLUGNMEET_LOCK_SHARED_NOTEPAD="Blocca blocco note condiviso"
COM_PLUGNMEET_LOCK_SHARED_NOTEPAD_DES="Lock the shared notepad for participants. They cannot write in the shared notepad until a moderator unlocks it."
COM_PLUGNMEET_LOCK_WEBCAM="Blocca la webcam"
COM_PLUGNMEET_LOCK_WEBCAM_DES="Lock the webcam for participants. They cannot share their camera until a moderator unlocks it."
COM_PLUGNMEET_LOCK_WHITEBOARD="Blocca la lavagna"
COM_PLUGNMEET_LOCK_WHITEBOARD_DES="Lock the whiteboard for participants. They cannot draw or annotate on the whiteboard until a moderator unlocks it."
COM_PLUGNMEET_LOCK_REACTIONS="Lock reactions"
