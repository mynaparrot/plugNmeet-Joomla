COM_PLUGNMEET_ROOM_MAX_PARTICIPANTS="Máximo de participantes"
COM_PLUGNMEET_ROOM_MAX_PARTICIPANTS_DES="Limit how many users can join at the same time. Set to 0 to allow unlimited participants. This cannot be changed after the session has started."

COM_PLUGNMEET_ACTIVATE_WAITING_ROOM="Ativar a sala de espera"
COM_PLUGNMEET_ACTIVATE_WAITING_ROOM_DES="Enable the waiting room for this session. Attendees wait until a moderator admits them."
COM_PLUGNMEET_ACTIVATE_WAITING_ROOM_MSG="Mensagem da sala de espera"
COM_PLUGNMEET_ACTIVATE_WAITING_ROOM_MSG_DES="This message is shown to users while they are waiting to be admitted. Use it to share instructions, expectations, or helpful information before the session starts."
COM_PLUGNMEET_ADMIN_ONLY_WEBCAMS="Webcams apenas para administradores"
COM_PLUGNMEET_ADMIN_ONLY_WEBCAMS_DES="Only allow moderators to use their webcams."
COM_PLUGNMEET_ALLOW_BREAKOUT_ROOMS="Permitir salas de descanso"
COM_PLUGNMEET_ALLOW_BREAKOUT_ROOMS_DES="Enables moderators to split participants into smaller groups for focused discussions, collaborative projects, or private group activities."
COM_PLUGNMEET_ALLOW_BREAKOUT_ROOMS_NUMBER="Permitir o número de quartos"
COM_PLUGNMEET_ALLOW_BREAKOUT_ROOMS_NUMBER_DES="The maximum number of sub-rooms a moderator can create within a single session. Default: 4"
COM_PLUGNMEET_ALLOW_INGRESS="Allow create ingress"
COM_PLUGNMEET_ALLOW_INGRESS_DES="Allows moderators to broadcast high-quality video into the session using external software like OBS via RTMP or WHIP protocols."
COM_PLUGNMEET_ALLOW_SPEECH="Permitir voz para texto"
COM_PLUGNMEET_ALLOW_SPEECH_DES="Permitir serviço de voz para texto"
COM_PLUGNMEET_ALLOW_SPEECH_TRANSLATION="Permitir tradução"
COM_PLUGNMEET_ALLOW_SPEECH_TRANSLATION_DES="Permitir serviço de voz para texto com tradução"
COM_PLUGNMEET_ENABLE_E2EE="Enable End-To-End Encryption (E2EE)"
COM_PLUGNMEET_ENABLE_E2EE_DES="Provides strong security by encrypting video and audio streams between participants. In this mode, the server generates and securely distributes a unique encryption key for the session."
COM_PLUGNMEET_ENABLE_E2EE_SELF_INSERT_KEY="Ativar a chave de auto-inserção"
COM_PLUGNMEET_ENABLE_E2EE_SELF_INSERT_KEY_DES="Allows participants to manually enter a shared secret key, offering the highest level of privacy as the server never has access to the encryption keys. It is the host's responsibility to share the same secret with all participants; if different keys are used, users will not be able to communicate with each other. <br><b>Note:</b> When this option is enabled, features that require server-side media processing (like cloud recording, transcription, and AI summarization) will be automatically disabled."
COM_PLUGNMEET_ENABLE_E2EE_CHAT="Enable encryption for chat"
COM_PLUGNMEET_ENABLE_E2EE_CHAT_DES="Extends end-to-end encryption to text chat, ensuring messages are only readable by participants in the room."
COM_PLUGNMEET_ENABLE_E2EE_WHITEBOARD="Enable encryption for whiteboard"
COM_PLUGNMEET_ENABLE_E2EE_WHITEBOARD_DES="Includes all whiteboard drawings and annotations in the end-to-end encryption layer for total data privacy."
COM_PLUGNMEET_ALLOW_CHAT="Permitir conversa"
COM_PLUGNMEET_ALLOW_CHAT_DES="The absolute master switch for all chat functions. If disabled, the entire chat area is removed for everyone, including moderators."
COM_PLUGNMEET_ALLOW_CLOUD_RECORDING="Permitir gravação na nuvem"
COM_PLUGNMEET_ALLOW_CLOUD_RECORDING_DES="Enables recording on the plugNmeet server. The final video is processed and stored in the cloud, making it easy to share via a link once the session ends."
COM_PLUGNMEET_START_AUTO_CLOUD_RECORDING="Enable auto cloud recording"
COM_PLUGNMEET_START_AUTO_CLOUD_RECORDING_DES="Automatically triggers the cloud recording the moment the first moderator joins the session. Ideal for ensuring no session is forgotten."
COM_PLUGNMEET_ALLOW_DISPLAY_EXTERNAL_LINK="Allow Display External Link"
COM_PLUGNMEET_ALLOW_DISPLAY_EXTERNAL_LINK_DES="Allows moderators to display external content, such as H5P activities, SCORM packages, or quiz systems (e.g., Kahoot), directly to all participants during the session."
COM_PLUGNMEET_ALLOW_EXTERNAL_MEDIAL_PLAYER="Allow external media player"
COM_PLUGNMEET_ALLOW_EXTERNAL_MEDIAL_PLAYER_DES="Allows moderators to sync and play videos from sources like YouTube or Vimeo for everyone."
COM_PLUGNMEET_ALLOW_FILE_UPLOAD="Permitir upload de ficheiros"
COM_PLUGNMEET_ALLOW_FILE_UPLOAD_DES="Enables the ability to share files within the chat. This requires the chat feature to be active."
COM_PLUGNMEET_ALLOW_LOCAL_RECORDING="Permitir gravação local"
COM_PLUGNMEET_ALLOW_LOCAL_RECORDING_DES="Allows recording directly to the computer. <strong>Note:</strong> Requires Google Chrome. To capture all session audio, the user must share their Chrome Tab and check the Also share tab audio box."
COM_PLUGNMEET_ALLOW_POLLS="Permitir votos"
COM_PLUGNMEET_ALLOW_POLLS_DES="Enables moderators to create interactive polls and quick quizzes during the session."
COM_PLUGNMEET_ENABLE_ANALYTICS="Permitir análises"
COM_PLUGNMEET_ENABLE_ANALYTICS_DES="Tracks participation and engagement data for the session."
COM_PLUGNMEET_ALLOW_VIRTUAL_BG="Permitir fundo virtual"
COM_PLUGNMEET_ALLOW_VIRTUAL_BG_DES="Enables participants to blur their background or use a virtual image."
COM_PLUGNMEET_ALLOW_RAISE_HAND="Permitir levantar a mão"
COM_PLUGNMEET_ALLOW_RAISE_HAND_DES="Allow participants to raise their hand."
COM_PLUGNMEET_ALLOW_REACTIONS="Permitir reações"
COM_PLUGNMEET_ALLOW_REACTIONS_DES="Allow participants to send floating reactions (e.g., thumbs up, clap) during the session."
COM_PLUGNMEET_AUTO_GEN_USER_ID="Gerar automaticamente ID de utilizador"
COM_PLUGNMEET_AUTO_GEN_USER_ID_DES="When enabled, the system creates a new ID for each join so the same user can join from multiple devices. When disabled, Joomla user ID is used for logged-in users. It is recommended to keep this off so duplicate joins are prevented."
COM_PLUGNMEET_ALLOW_RECORDING="Permitir gravação"
COM_PLUGNMEET_ALLOW_RECORDING_DES="The primary master switch for all recording features. If disabled, both cloud and local recording options will be hidden from moderators."
COM_PLUGNMEET_ALLOW_RTMP="Allow RTMP broadcasting"
COM_PLUGNMEET_ALLOW_RTMP_DES="Enables moderators to broadcast the live session to external platforms like YouTube, Facebook, or Twitch."
COM_PLUGNMEET_ROOM_DURATION="Duração da sala"
COM_PLUGNMEET_ROOM_DURATION_DES="Defines how long the room can stay open, in minutes, before it closes automatically. Enter 0 for no time limit. This value cannot be changed after the session has started."
COM_PLUGNMEET_ALLOW_SCREEN_SHARING="Permitir partilha de ecrã"
COM_PLUGNMEET_ALLOW_SCREEN_SHARING_DES="Allow participants to share their screen."
COM_PLUGNMEET_ALLOW_SHARED_NOTEPAD="Allow shared notepad"
COM_PLUGNMEET_ALLOW_SHARED_NOTEPAD_DES="Enables a collaborative text editor where participants and moderators can take real-time notes together."
COM_PLUGNMEET_ALLOW_VIEW_OTHER_USERS="Allow view other users list"
COM_PLUGNMEET_ALLOW_VIEW_OTHER_USERS_DES="Allow participants to see the list of other participants."
COM_PLUGNMEET_ALLOW_VIEW_OTHER_WEBCAMS="Permitir ver outras webcams"
COM_PLUGNMEET_ALLOW_VIEW_OTHER_WEBCAMS_DES="Allow participants to view other participants webcams. If disabled, they will only see moderators webcams."
COM_PLUGNMEET_ALLOW_WEBCAMS="Permitir webcams"
COM_PLUGNMEET_ALLOW_WEBCAMS_DES="Allow participants to use their webcams."
COM_PLUGNMEET_ALLOW_WHITEBOARD="Allow whiteboard"
COM_PLUGNMEET_ALLOW_WHITEBOARD_DES="Unlocks an interactive drawing space for the session. Use it for sketching diagrams or letting participants annotate shared content."
COM_PLUGNMEET_WHITEBOARD_PRE_LOAD_FILE="ficheiro pré-carregado"
COM_PLUGNMEET_WHITEBOARD_PRE_LOAD_FILE_DES="http/https direct link to a file to preload on the whiteboard. Example: https://example.com/myfile.pdf"
