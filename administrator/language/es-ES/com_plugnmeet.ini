COM_PLUGNMEET_ROOM_TAB_INSIGHTS_AI_FEATURES="IA de Insights"
COM_PLUGNMEET_INSIGHTS_IS_ALLOW="Habilitar las funciones de análisis"
COM_PLUGNMEET_INSIGHTS_IS_ALLOW_DES="Habilitar herramientas basadas en IA y análisis avanzado para esta sala, como la transcripción y traducción en vivo. Si desactivas este interruptor principal, todas las funcionalidades asociadas de abajo se deactivarán. <br><b>Aviso de privacidad:</b> Activar estos análisis puede compartir datos de reuniones (como mensajes de audio y chat) con proveedores externos para su procesamiento. Por favor, asegúrese de que esto cumpla con su política de privacidad."
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW="Habilitar la transcripción en vivo"
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW_DES="Proporciona transcripción en tiempo real del audio de la reunión, permitiendo a los participantes leer la conversación a medida que se desarrolla."
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW_TRANSLATION="Habilitar la traducción en vivo para la transcripción"
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW_TRANSLATION_DES="Permite a los participantes traducir la transcripción en directo a su idioma preferido."
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW_SPEECH_SYNTHESIS="Activar subtítulos hablados"
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW_SPEECH_SYNTHESIS_DES="Permite a los participantes escuchar en voz alta los subtítulos traducidos en su idioma preferido."
COM_PLUGNMEET_INSIGHTS_CHAT_TRANSLATION_IS_ALLOW="Habilitar la traducción de mensajes de chat"
COM_PLUGNMEET_INSIGHTS_CHAT_TRANSLATION_IS_ALLOW_DES="Permite a los participantes traducir mensajes de chat al idioma que prefieran."
COM_PLUGNMEET_INSIGHTS_AI_FEATURES_IS_ALLOW="Habilitar funciones de IA"
COM_PLUGNMEET_INSIGHTS_AI_FEATURES_IS_ALLOW_DES="Activa herramientas de IA para esta sala, como resúmenes automáticos y un asistente de chat con IA. Si desactivas esto, todas las funciones de IA abajo quedarán deshabilitadas. <br><b>Aviso de privacidad:</b> Estas herramientas procesan el contenido de reuniones a través de proveedores externos de IA. Por favor, usarlas conforme a las políticas de privacidad de su organización."
COM_PLUGNMEET_INSIGHTS_AI_TEXT_CHAT_IS_ALLOW="Habilitar el Asistente de Chat con IA"
COM_PLUGNMEET_INSIGHTS_AI_TEXT_CHAT_IS_ALLOW_DES="Proporciona a los participantes un asistente de chat con IA para responder preguntas y proporcionar información durante la reunión."
COM_PLUGNMEET_INSIGHTS_MEETING_SUMMARIZATION_IS_ALLOW="Habilitar resúmenes automatizados de reuniones"
COM_PLUGNMEET_INSIGHTS_MEETING_SUMMARIZATION_IS_ALLOW_DES="Genera automáticamente un resumen de la reunión, incluyendo temas clave y acciones pendientes, disponible una vez finalizada la sesión."

COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_IS_ALLOW="Habilitar acceso telefónico SIP"
COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_IS_ALLOW_DES="Permite que los participantes se unan al audio de la reunión mediante una llamada telefónica."
COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_ENABLE_ON_CREATE="Habilitar acceso telefónico al crear"
COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_ENABLE_ON_CREATE_DES="Si está activado, el servicio de acceso telefónico SIP se iniciará automáticamente cuando se cree la sala."
COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_HIDE_PHONE="Ocultar los números de teléfono de los participantes"
COM_PLUGNMEET_EXTERNAL_BROADCASTING_IS_ALLOW="Activar transmisión externa"
COM_PLUGNMEET_EXTERNAL_BROADCASTING_IS_ALLOW_DES="Activa las funciones relacionadas con la transmisión externa, como el streaming RTMP."
COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_HIDE_PHONE_DES="Si está activado, el número de teléfono de los participantes que llamen por teléfono se ocultará y solo se mostrarán los últimos 4 dígitos como su nombre."

