COM_PLUGNMEET_INSIGHTS_IS_ALLOW="تمكين ميزات الرؤية"
COM_PLUGNMEET_INSIGHTS_IS_ALLOW_DES="تمكين التحليلات المتقدمة وأدوات الذكاء الاصطناعي لهذه الغرفة، مثل النسخ الحي، والترجمة. تعطيل هذا المفتاح الرئيسي سيؤدي إلى تعطيل جميع الميزات ذات الصلة أدناه. <br><b>إشعار الخصوصية:</b> تفعيل هذه الرؤى قد يشارك بيانات الاجتماعات (مثل رسائل الصوت والدردشة) مع مزودي الخدمة الخارجيين للمعالجة. يرجى التأكد من أن هذا يتوافق مع سياسة الخصوصية الخاصة بك."
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW="تمكين النسخ المباشر"
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW_DES="قدم نصا فوريا لصوت الاجتماع، مما يسمح للمشاركين بقراءة المحادثة أثناء حدوثها."
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW_TRANSLATION="تمكين الترجمة الحية للنسخ"
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW_TRANSLATION_DES="اسمح للمشاركين بترجمة النسخ الحي إلى لغتهم المفضلة."
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW_SPEECH_SYNTHESIS="تفعيل الترجمة المنطوقة"
COM_PLUGNMEET_INSIGHTS_TRANSCRIPTION_IS_ALLOW_SPEECH_SYNTHESIS_DES="اسمح للمشاركين بسماع الترجمة المترجمة بصوت عال بلغتهم المختارة."
COM_PLUGNMEET_INSIGHTS_CHAT_TRANSLATION_IS_ALLOW="تمكين ترجمة رسائل الدردشة"
COM_PLUGNMEET_INSIGHTS_CHAT_TRANSLATION_IS_ALLOW_DES="اسمح للمشاركين بترجمة رسائل الدردشة إلى لغتهم المفضلة."
COM_PLUGNMEET_INSIGHTS_AI_FEATURES_IS_ALLOW="تمكين ميزات الذكاء الاصطناعي"
COM_PLUGNMEET_INSIGHTS_AI_FEATURES_IS_ALLOW_DES="فعل أدوات الذكاء الاصطناعي مفيدة لهذه الغرفة، مثل ملخصات الاجتماعات الآلية ومساعد دردشة الذكاء الاصطناعي. تعطيل هذا سيوقف جميع ميزات الذكاء الاصطناعي المحددة أدناه. <br><b>إشعار الخصوصية:</b> تعالج هذه الأدوات محتوى الاجتماعات من خلال مزودي الذكاء الاصطناعي الخارجيين. يرجى استخدامها وفقا لإرشادات الخصوصية الخاصة بمؤسستك."
COM_PLUGNMEET_INSIGHTS_AI_TEXT_CHAT_IS_ALLOW="تمكين مساعد الدردشة الذكاء الاصطناعي"
COM_PLUGNMEET_INSIGHTS_AI_TEXT_CHAT_IS_ALLOW_DES="وفر للمشاركين مساعد دردشة الذكاء الاصطناعي للإجابة على الأسئلة وتقديم المعلومات خلال الاجتماع."
COM_PLUGNMEET_INSIGHTS_MEETING_SUMMARIZATION_IS_ALLOW="تمكين ملخصات الاجتماعات الآلية"
COM_PLUGNMEET_INSIGHTS_MEETING_SUMMARIZATION_IS_ALLOW_DES="قم تلقائيا بإنشاء ملخص للاجتماع، بما في ذلك المواضيع الرئيسية وعناصر العمل، المتاحة بعد انتهاء الجلسة."

COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_IS_ALLOW="تمكين الاتصال الموصول ب SIP"
COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_IS_ALLOW_DES="اسمح للمشاركين بالانضمام إلى الصوت في الاجتماع عبر مكالمة هاتفية منتظمة."
COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_ENABLE_ON_CREATE="تمكين الاتصال الهاتفي في Create"
COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_ENABLE_ON_CREATE_DES="إذا تم تفعيلها، ستبدأ خدمة الاتصال تلقائيا عند إنشاء الغرفة."
COM_PLUGNMEET_ALLOW_SIP_DIAL_IN_HIDE_PHONE="أرقام هواتف المشاركين في الكمامات"
